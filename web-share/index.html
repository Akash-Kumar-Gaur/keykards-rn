<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A0A14" />
    <title>Shared card · KeyKards</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="shell">
      <p class="eyebrow">Shared with you</p>
      <h1>Card details</h1>
      <div id="status" class="status">Opening secure link…</div>
      <p id="scope-note" class="meta hidden"></p>
      <div id="card" class="card hidden" aria-live="polite">
        <div class="card-top">
          <div>
            <div class="bank" id="bank"></div>
            <div class="nick" id="nick"></div>
          </div>
          <div class="network" id="network"></div>
        </div>
        <div class="chip"></div>
        <button type="button" class="number-row" id="reveal" aria-label="Show card number">
          <span class="number" id="number"></span>
          <span class="eye" id="eye">👁</span>
        </button>
        <div class="card-bottom">
          <span id="exp"></span>
          <span class="muted">CVV not shared</span>
        </div>
      </div>
      <p id="cardholder" class="meta hidden"></p>
      <p id="expires" class="meta hidden"></p>
      <footer>
        Shared securely via
        <a href="https://keykards.redevolve.in" rel="noopener">KeyKards</a>
      </footer>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
